<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>영수증</title>
<style>
  @keyframes slideDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }

  body {
    font-family: "Apple SD Gothic Neo", sans-serif;
    background: linear-gradient(135deg, #7B5BA7 0%, #9B7BC4 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    color: #2C2C2C;
  }
  .receipt-container {
    width: 100%;
    max-width: 460px;
  }
  .receipt {
    background: white;
    border-left: 6px solid #7B5BA7;
    padding: 32px;
    box-shadow: 0 12px 40px rgba(123, 91, 167, 0.2);
    border-radius: 8px;
    animation: slideDown 0.6s ease-out;
  }
  .header {
    margin-bottom: 24px;
    padding-bottom: 16px;
    border-bottom: 2px solid #E6D9F0;
    text-align: center;
  }
  .store-name {
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 4px;
    color: #7B5BA7;
  }
  .receipt-title {
    font-size: 12px;
    color: #999;
    margin-top: 12px;
    letter-spacing: 2px;
  }
  .receipt-date {
    font-size: 12px;
    color: #BBB;
    margin-top: 6px;
  }
  .section {
    margin: 20px 0;
    border-bottom: 1px solid #E6D9F0;
    padding-bottom: 16px;
  }
  .section:last-of-type {
    border-bottom: none;
  }
  .item-header {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    margin-bottom: 10px;
    font-weight: 600;
    color: #666;
  }
  .divider {
    border-top: 1px dashed #E6D9F0;
    margin: 10px 0;
  }
  .item-row {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    margin-bottom: 10px;
    gap: 8px;
  }
  .item-name {
    text-align: left;
    flex: 1;
    color: #2C2C2C;
    font-weight: 500;
  }
  .item-qty {
    text-align: right;
    min-width: 35px;
    color: #666;
  }
  .item-price {
    text-align: right;
    min-width: 75px;
    font-weight: 600;
    color: #7B5BA7;
  }
  .detail-row {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    margin-bottom: 10px;
    gap: 8px;
  }
  .detail-label {
    color: #999;
  }
  .detail-value {
    text-align: right;
    font-weight: 500;
    color: #2C2C2C;
  }
  .total-section {
    background: linear-gradient(135deg, rgba(123, 91, 167, 0.04) 0%, rgba(181, 101, 216, 0.04) 100%);
    border-radius: 8px;
    padding: 14px;
    margin: 16px 0;
  }
  .total-label {
    font-size: 12px;
    color: #999;
    margin-bottom: 8px;
    font-weight: 500;
  }
  .total-amount {
    font-size: 28px;
    font-weight: 800;
    color: #7B5BA7;
  }
  .footer-info {
    text-align: left;
    font-size: 12px;
    color: #666;
    line-height: 1.8;
  }
  .footer-info div {
    margin-bottom: 6px;
  }
  .footer-message {
    margin-top: 18px;
    padding-top: 14px;
    border-top: 1px dashed #E6D9F0;
    text-align: center;
    font-size: 12px;
    color: #7B5BA7;
    font-weight: 500;
    line-height: 1.6;
  }
  .back-button {
    display: block;
    margin-top: 28px;
    padding: 12px 28px;
    background: linear-gradient(135deg, #7B5BA7 0%, #9B7BC4 100%);
    color: white;
    text-decoration: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    text-align: center;
    transition: all 0.3s;
    box-shadow: 0 6px 16px rgba(123, 91, 167, 0.2);
    border: none;
    cursor: pointer;
  }
  .back-button:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(123, 91, 167, 0.3);
  }
  .error {
    color: #d32f2f;
    padding: 40px 20px;
    text-align: center;
    font-size: 16px;
  }
</style>
</head>
<body>
  <script defer src="https://cdn.vercel-analytics.com/v1/script.js"></script>
  <div class="receipt-container">
    <div id="content"></div>
    <a href="list.html" class="back-button">← 목록으로</a>
  </div>

<script>
async function load() {
  const id = new URLSearchParams(location.search).get('id');
  if (!id) {
    document.getElementById('content').innerHTML = '<p class="error">❌ ID가 없습니다</p>';
    return;
  }

  try {
    const res = await fetch(`/api/list?id=${id}`);
    if (!res.ok) {
      document.getElementById('content').innerHTML = '<p class="error">❌ 정보를 불러올 수 없습니다</p>';
      return;
    }
    const data = await res.json();
    document.title = `영수증 #${data.id}`;

    const dateObj = new Date(data.purchased_at);
    const dateStr = dateObj.toLocaleDateString('ko-KR');
    const timeStr = dateObj.toLocaleTimeString('ko-KR');

    const emojis = {
      '카페라떼': '☕', '아메리카노': '🖤', '코코아': '🤎', '우유': '🥛', '율무차': '🟫'
    };
    const emoji = emojis[data.product] || '☕';

    document.getElementById('content').innerHTML = `
      <div class="receipt">
        <div class="header">
          <div class="store-name">☕ 커피 자판기</div>
          <div class="receipt-title">─── 영 수 증 ───</div>
          <div class="receipt-date">${dateStr} ${timeStr}</div>
        </div>

        <div class="section">
          <div class="item-header">
            <span>상품</span>
            <span>수량</span>
            <span>단가</span>
          </div>
          <div class="divider"></div>
          <div class="item-row">
            <span class="item-name">${emoji} ${data.product}</span>
            <span class="item-qty">${data.quantity}개</span>
            <span class="item-price">${data.price_per_unit.toLocaleString('ko-KR')}원</span>
          </div>
        </div>

        <div class="total-section">
          <div class="total-label">합계</div>
          <div class="total-amount">${data.total_price.toLocaleString('ko-KR')}원</div>
        </div>

        <div class="section">
          <div class="detail-row">
            <span class="detail-label">구매자</span>
            <span class="detail-value">${data.buyer_name}</span>
          </div>
          <div class="detail-row">
            <span class="detail-label">주문번호</span>
            <span class="detail-value">#${data.id}</span>
          </div>
        </div>

        <div class="section">
          <div style="background: linear-gradient(135deg, rgba(123, 91, 167, 0.06) 0%, rgba(181, 101, 216, 0.04) 100%); border-radius: 8px; padding: 12px; font-size: 12px; color: #666; line-height: 1.6; border-left: 3px solid #7B5BA7;">
            <strong style="color: #7B5BA7;">☕ 커피 자판기</strong><br>
            매일 신선하게 준비한 최고의 커피<br>
            🕐 매일 아침 8시 ~ 저녁 6시
          </div>
        </div>

        <div class="footer-message">
          감사합니다! 다시 방문해주세요 ☕
        </div>
      </div>
    `;
  } catch (e) {
    document.getElementById('content').innerHTML = `<p class="error">❌ 오류: ${e.message}</p>`;
  }
}
load();
</script>
</body>
</html>
