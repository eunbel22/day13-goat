<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>영수증</title>
<style>
  body {
    font-family: "Courier New", monospace;
    background: linear-gradient(135deg, #FAF8FC 0%, #F5F2FA 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    color: #2C2C2C;
  }
  .receipt-container {
    width: 100%;
    max-width: 420px;
  }
  .receipt {
    background: white;
    border: 2px solid #7B5BA7;
    padding: 24px;
    text-align: center;
    box-shadow: 0 8px 24px rgba(123, 91, 167, 0.15);
    border-radius: 8px;
  }
  .header {
    margin-bottom: 20px;
    border-bottom: 2px dashed #D4A8E6;
    padding-bottom: 12px;
  }
  .store-name {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 4px;
    color: #7B5BA7;
  }
  .store-tagline {
    font-size: 11px;
    color: #999;
    margin-bottom: 8px;
    font-family: "Apple SD Gothic Neo", sans-serif;
  }
  .receipt-title {
    font-size: 12px;
    color: #666;
    margin-bottom: 8px;
    letter-spacing: 3px;
  }
  .receipt-date {
    font-size: 11px;
    color: #888;
    font-family: "Apple SD Gothic Neo", sans-serif;
  }
  .section {
    margin: 16px 0;
    border-bottom: 2px dashed #D4A8E6;
    padding-bottom: 12px;
  }
  .section:last-of-type {
    border-bottom: 2px solid #7B5BA7;
  }
  .item-row {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    margin-bottom: 8px;
    align-items: flex-start;
    gap: 8px;
  }
  .item-name {
    text-align: left;
    flex: 1;
  }
  .item-qty {
    text-align: right;
    min-width: 30px;
  }
  .item-price {
    text-align: right;
    min-width: 80px;
    font-weight: bold;
  }
  .divider {
    border-top: 2px dashed #D4A8E6;
    margin: 8px 0;
  }
  .total-section {
    margin: 12px 0;
  }
  .total-label {
    font-size: 12px;
    margin-bottom: 8px;
  }
  .total-amount {
    font-size: 28px;
    font-weight: bold;
    margin: 8px 0;
    letter-spacing: 1px;
    color: #7B5BA7;
  }
  .footer-info {
    margin: 16px 0;
    text-align: left;
    font-size: 12px;
    color: #555;
  }
  .footer-info div {
    margin-bottom: 4px;
    font-family: "Apple SD Gothic Neo", sans-serif;
  }
  .footer-message {
    margin-top: 16px;
    padding-top: 12px;
    border-top: 2px dashed #D4A8E6;
    font-size: 11px;
    color: #888;
    font-family: "Apple SD Gothic Neo", sans-serif;
    line-height: 1.6;
  }
  .promo {
    background: linear-gradient(135deg, #F0E6F8 0%, #E6D9F0 100%);
    border-radius: 6px;
    padding: 12px;
    margin-top: 16px;
    font-size: 11px;
    color: #7B5BA7;
    font-family: "Apple SD Gothic Neo", sans-serif;
    line-height: 1.5;
  }
  .back-button {
    display: block;
    margin-top: 24px;
    padding: 12px 24px;
    background: #7B5BA7;
    color: white;
    text-decoration: none;
    border-radius: 8px;
    font-family: "Apple SD Gothic Neo", sans-serif;
    font-size: 14px;
    text-align: center;
    transition: all 0.3s;
  }
  .back-button:hover {
    background: #6B4A94;
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(123, 91, 167, 0.2);
  }
  .error {
    color: #d32f2f;
    font-family: "Apple SD Gothic Neo", sans-serif;
    padding: 20px;
    text-align: center;
  }
</style>
</head>
<body>
  <div class="receipt-container">
    <div id="content"></div>
    <a href="list.html" class="back-button">← 목록으로</a>
  </div>

<script>
async function load() {
  const id = new URLSearchParams(location.search).get('id');
  if (!id) {
    document.getElementById('content').innerHTML = '<p class="error">ID가 없습니다</p>';
    return;
  }

  try {
    const res = await fetch(`/api/list?id=${id}`);
    if (!res.ok) {
      document.getElementById('content').innerHTML = '<p class="error">정보를 불러올 수 없습니다</p>';
      return;
    }
    const data = await res.json();
    document.title = `영수증 #${data.id}`;

    const dateObj = new Date(data.purchased_at);
    const dateStr = dateObj.toLocaleDateString('ko-KR');
    const timeStr = dateObj.toLocaleTimeString('ko-KR');

    document.getElementById('content').innerHTML = `
      <div class="receipt">
        <div class="header">
          <div class="store-name">☕ 커피 자판기</div>
          <div class="store-tagline">Fresh Coffee, Always Ready</div>
          <div class="receipt-title">= 영 수 증 =</div>
          <div class="receipt-date">${dateStr} ${timeStr}</div>
        </div>

        <div class="section">
          <div class="item-row">
            <div class="item-name"><strong>상품</strong></div>
            <div class="item-qty"><strong>수량</strong></div>
            <div class="item-price"><strong>금액</strong></div>
          </div>
          <div class="divider"></div>
          <div class="item-row">
            <div class="item-name">${data.product}</div>
            <div class="item-qty">${data.quantity}</div>
            <div class="item-price">${data.price_per_unit.toLocaleString('ko-KR')}원</div>
          </div>
        </div>

        <div class="total-section">
          <div class="total-label">총 ${data.quantity}개</div>
          <div class="divider"></div>
          <div class="total-label">합 계</div>
          <div class="total-amount">${data.total_price.toLocaleString('ko-KR')}</div>
        </div>

        <div class="section">
          <div class="footer-info">
            <div>👤 구매자: ${data.buyer_name}</div>
            <div>📋 주문번호: #${data.id}</div>
          </div>
        </div>

        <div class="footer-message">
          감사합니다!
          <br>
          다시 방문해 주세요 ☕
        </div>

        <div class="promo">
          🌟 <strong>프리미엄 커피</strong><br>
          매일 신선하게 준비한 최고의 커피<br>
          <strong style="color: #7B5BA7;">매일 아침 8시부터 저녁 6시까지</strong>
        </div>
      </div>
    `;
  } catch (e) {
    document.getElementById('content').innerHTML = `<p class="error">오류: ${e.message}</p>`;
  }
}
load();
</script>
</body>
</html>
