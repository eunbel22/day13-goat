<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>영수증</title>
<style>
  @keyframes slideDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes shine { 0%, 100% { text-shadow: none; } 50% { text-shadow: 0 0 10px rgba(181, 101, 216, 0.5); } }
  @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-4px); } }

  body {
    font-family: "Courier New", monospace;
    background: linear-gradient(135deg, #FAF8FC 0%, #F5F2FA 50%, #E6D9F0 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    color: #2C2C2C;
  }
  .receipt-container {
    width: 100%;
    max-width: 460px;
  }
  .receipt {
    background: linear-gradient(135deg, #FFFFFF 0%, #FAFBFF 100%);
    border: 3px solid #7B5BA7;
    padding: 32px;
    text-align: center;
    box-shadow:
      0 20px 60px rgba(123, 91, 167, 0.3),
      0 0 40px rgba(181, 101, 216, 0.2);
    border-radius: 12px;
    position: relative;
    animation: slideDown 0.6s ease-out;
  }
  .receipt::before {
    content: '';
    position: absolute;
    top: -10px;
    left: 50%;
    transform: translateX(-50%);
    width: 40px;
    height: 20px;
    background: linear-gradient(135deg, #7B5BA7 0%, #B565D8 100%);
    border-radius: 0 0 20px 20px;
  }
  .receipt::after {
    content: '';
    position: absolute;
    bottom: -10px;
    left: 50%;
    transform: translateX(-50%);
    width: 40px;
    height: 20px;
    background: linear-gradient(135deg, #7B5BA7 0%, #B565D8 100%);
    border-radius: 20px 20px 0 0;
  }
  .header {
    margin-bottom: 24px;
    border-bottom: 3px dashed #B565D8;
    padding-bottom: 16px;
  }
  .store-name {
    font-size: 24px;
    font-weight: bold;
    margin-bottom: 6px;
    color: #7B5BA7;
    animation: shine 2s infinite;
    letter-spacing: 1px;
  }
  .store-tagline {
    font-size: 12px;
    color: #999;
    margin-bottom: 10px;
    font-family: "Apple SD Gothic Neo", sans-serif;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .receipt-title {
    font-size: 13px;
    color: #7B5BA7;
    margin-bottom: 10px;
    letter-spacing: 4px;
    font-weight: bold;
  }
  .receipt-date {
    font-size: 12px;
    color: #666;
    font-family: "Apple SD Gothic Neo", sans-serif;
    font-weight: 500;
  }
  .section {
    margin: 20px 0;
    border-bottom: 3px dashed #B565D8;
    padding-bottom: 16px;
  }
  .section:last-of-type {
    border-bottom: 3px solid #7B5BA7;
  }
  .item-row {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    margin-bottom: 10px;
    align-items: flex-start;
    gap: 8px;
    font-weight: 500;
  }
  .item-name {
    text-align: left;
    flex: 1;
    color: #7B5BA7;
  }
  .item-qty {
    text-align: right;
    min-width: 35px;
    color: #666;
  }
  .item-price {
    text-align: right;
    min-width: 85px;
    font-weight: bold;
    color: #2C2C2C;
  }
  .divider {
    border-top: 2px dashed #E6D9F0;
    margin: 12px 0;
  }
  .total-section {
    margin: 16px 0;
  }
  .total-label {
    font-size: 13px;
    margin-bottom: 10px;
    font-weight: 600;
    color: #666;
  }
  .total-amount {
    font-size: 32px;
    font-weight: bold;
    margin: 12px 0;
    letter-spacing: 2px;
    background: linear-gradient(135deg, #7B5BA7 0%, #B565D8 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: float 2s ease-in-out infinite;
  }
  .footer-info {
    margin: 16px 0;
    text-align: left;
    font-size: 12px;
    color: #555;
    font-family: "Apple SD Gothic Neo", sans-serif;
  }
  .footer-info div {
    margin-bottom: 6px;
    font-weight: 500;
  }
  .footer-message {
    margin-top: 18px;
    padding-top: 14px;
    border-top: 3px dashed #B565D8;
    font-size: 12px;
    color: #7B5BA7;
    font-family: "Apple SD Gothic Neo", sans-serif;
    line-height: 1.8;
    font-weight: 600;
    letter-spacing: 0.5px;
  }
  .promo {
    background: linear-gradient(135deg, #F0E6F8 0%, #E6D9F0 100%);
    border: 2px solid #B565D8;
    border-radius: 8px;
    padding: 16px;
    margin-top: 20px;
    font-size: 12px;
    color: #7B5BA7;
    font-family: "Apple SD Gothic Neo", sans-serif;
    line-height: 1.7;
    box-shadow: 0 4px 12px rgba(181, 101, 216, 0.15);
  }
  .promo-title {
    font-weight: 700;
    margin-bottom: 8px;
    color: #7B5BA7;
    letter-spacing: 0.5px;
  }
  .back-button {
    display: block;
    margin-top: 32px;
    padding: 14px 32px;
    background: linear-gradient(135deg, #7B5BA7 0%, #B565D8 100%);
    color: white;
    text-decoration: none;
    border-radius: 12px;
    font-family: "Apple SD Gothic Neo", sans-serif;
    font-size: 15px;
    font-weight: 600;
    text-align: center;
    transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    box-shadow: 0 8px 20px rgba(123, 91, 167, 0.25);
    border: none;
    cursor: pointer;
    letter-spacing: 0.5px;
  }
  .back-button:hover {
    transform: translateY(-4px);
    box-shadow: 0 12px 32px rgba(181, 101, 216, 0.4);
  }
  .back-button:active {
    transform: translateY(-1px);
  }
  .error {
    color: #d32f2f;
    font-family: "Apple SD Gothic Neo", sans-serif;
    padding: 40px 20px;
    text-align: center;
    font-size: 16px;
  }
  .decoration {
    font-size: 20px;
    letter-spacing: 8px;
    color: #E6D9F0;
    margin: 16px 0;
  }
</style>
</head>
<body>
  <div class="receipt-container">
    <div id="content"></div>
    <a href="list.html" class="back-button">← 목록으로 돌아가기</a>
  </div>

<script>
async function load() {
  const id = new URLSearchParams(location.search).get('id');
  if (!id) {
    document.getElementById('content').innerHTML = '<p class="error">❌ ID가 없습니다</p>';
    return;
  }

  try {
    const res = await fetch(`/api/list?id=${id}`);
    if (!res.ok) {
      document.getElementById('content').innerHTML = '<p class="error">❌ 정보를 불러올 수 없습니다</p>';
      return;
    }
    const data = await res.json();
    document.title = `영수증 #${data.id}`;

    const dateObj = new Date(data.purchased_at);
    const dateStr = dateObj.toLocaleDateString('ko-KR');
    const timeStr = dateObj.toLocaleTimeString('ko-KR');

    const productEmoji = {
      '카페라떼': '☕',
      '아메리카노': '🖤',
      '코코아': '🤎',
      '우유': '🥛',
      '율무차': '🟫'
    };
    const emoji = productEmoji[data.product] || '☕';

    document.getElementById('content').innerHTML = `
      <div class="receipt">
        <div class="header">
          <div class="store-name">☕ 커피 자판기 ☕</div>
          <div class="store-tagline">✦ Fresh Coffee, Always Ready ✦</div>
          <div class="receipt-title">━━ 영 수 증 ━━</div>
          <div class="receipt-date">📅 ${dateStr}  ⏰ ${timeStr}</div>
        </div>

        <div class="decoration">✦ ✦ ✦</div>

        <div class="section">
          <div class="item-row">
            <div class="item-name"><strong>상품</strong></div>
            <div class="item-qty"><strong>수량</strong></div>
            <div class="item-price"><strong>가격</strong></div>
          </div>
          <div class="divider"></div>
          <div class="item-row">
            <div class="item-name">${emoji} ${data.product}</div>
            <div class="item-qty">${data.quantity}개</div>
            <div class="item-price">${data.price_per_unit.toLocaleString('ko-KR')}원</div>
          </div>
        </div>

        <div class="total-section">
          <div class="total-label">━━ 총 ${data.quantity}개 ━━</div>
          <div class="divider"></div>
          <div class="total-label">합 계</div>
          <div class="total-amount">₩${data.total_price.toLocaleString('ko-KR')}</div>
        </div>

        <div class="decoration">✦ ✦ ✦</div>

        <div class="section">
          <div class="footer-info">
            <div>👤 구매자 : ${data.buyer_name}</div>
            <div>🧾 주문번호 : #${data.id}</div>
          </div>
        </div>

        <div class="footer-message">
          🌟 감사합니다! 🌟
          <br><br>
          언제나 맛있는 커피로 만나요 ☕
        </div>

        <div class="promo">
          <div class="promo-title">☕ 프리미엄 커피</div>
          매일 신선하게 준비한 최고의 커피<br>
          🕐 매일 아침 8시 ~ 저녁 6시<br>
          <br>
          ⭐ 더 자주 방문해주세요!
        </div>
      </div>
    `;
  } catch (e) {
    document.getElementById('content').innerHTML = `<p class="error">❌ 오류: ${e.message}</p>`;
  }
}
load();
</script>
</body>
</html>
