<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>판매 현황</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

  body {
    font-family: "Apple SD Gothic Neo", sans-serif;
    background: linear-gradient(135deg, #F8F6FF 0%, #F3EFFF 50%, #EBE5F8 100%);
    min-height: 100vh;
    color: #2C2C2C;
  }
  .container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 28px 16px;
  }
  .header {
    text-align: center;
    margin-bottom: 40px;
    animation: fadeIn 0.6s ease-out;
  }
  .header h1 {
    font-size: 48px;
    margin-bottom: 8px;
    background: linear-gradient(135deg, #7B5BA7 0%, #B565D8 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    font-weight: 800;
  }
  .stats-section {
    background: linear-gradient(135deg, rgba(255,255,255,0.98) 0%, rgba(255,255,255,0.90) 100%);
    border-radius: 18px;
    padding: 28px;
    margin-bottom: 32px;
    box-shadow: 0 8px 32px rgba(123, 91, 167, 0.1);
    animation: fadeIn 0.8s ease-out;
  }
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 16px;
    margin-bottom: 24px;
  }
  .stat-card {
    background: linear-gradient(135deg, rgba(123, 91, 167, 0.05) 0%, rgba(181, 101, 216, 0.05) 100%);
    border-radius: 12px;
    padding: 18px;
    text-align: center;
    border: 1px solid rgba(123, 91, 167, 0.1);
  }
  .stat-icon {
    font-size: 32px;
    margin-bottom: 8px;
  }
  .stat-label {
    font-size: 12px;
    color: #999;
    font-weight: 500;
    margin-bottom: 6px;
  }
  .stat-value {
    font-size: 24px;
    font-weight: 800;
    color: #7B5BA7;
  }
  .chart-container {
    background: white;
    border-radius: 12px;
    padding: 18px;
    border: 1px solid #E6D9F0;
  }
  .chart-title {
    font-size: 13px;
    font-weight: 700;
    color: #7B5BA7;
    margin-bottom: 14px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .chart-bars {
    display: flex;
    align-items: flex-end;
    gap: 14px;
    height: 140px;
    justify-content: space-between;
  }
  .chart-bar-group {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    min-width: 0;
  }
  .chart-bar {
    width: 100%;
    background: linear-gradient(180deg, #7B5BA7 0%, #B565D8 100%);
    border-radius: 6px 6px 0 0;
    min-height: 20px;
    transition: all 0.3s;
  }
  .chart-bar:hover {
    filter: brightness(1.1);
  }
  .chart-label {
    font-size: 12px;
    color: #666;
    font-weight: 600;
    text-align: center;
    word-wrap: break-word;
    word-break: break-word;
    line-height: 1.3;
  }
  .chart-value {
    font-size: 11px;
    color: #7B5BA7;
    font-weight: 700;
  }
  .controls {
    background: linear-gradient(135deg, rgba(255,255,255,0.98) 0%, rgba(255,255,255,0.90) 100%);
    border-radius: 18px;
    padding: 24px;
    margin-bottom: 32px;
    box-shadow: 0 8px 32px rgba(123, 91, 167, 0.1);
    animation: fadeIn 0.8s ease-out;
  }
  .search-box {
    display: flex;
    gap: 12px;
    margin-bottom: 24px;
  }
  .search-input {
    flex: 1;
    padding: 12px 16px;
    border: 2px solid #E6D9F0;
    border-radius: 10px;
    font-size: 14px;
    font-family: inherit;
    transition: all 0.3s;
  }
  .search-input:focus {
    outline: none;
    border-color: #7B5BA7;
    box-shadow: 0 0 0 3px rgba(123, 91, 167, 0.1);
  }
  .filter-section {
    margin-bottom: 0;
  }
  .filter-label {
    font-size: 12px;
    color: #7B5BA7;
    margin-bottom: 10px;
    display: block;
    font-weight: 700;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }
  .filter-tabs {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    border-bottom: 2px solid #E6D9F0;
    padding-bottom: 12px;
    margin-bottom: 12px;
  }
  .filter-btn {
    padding: 8px 14px;
    border: none;
    background: transparent;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
    font-weight: 600;
    color: #999;
    transition: all 0.3s;
    position: relative;
  }
  .filter-btn:hover {
    color: #7B5BA7;
  }
  .filter-btn.active {
    color: #7B5BA7;
  }
  .filter-btn.active::after {
    content: '';
    position: absolute;
    bottom: -14px;
    left: 0;
    right: 0;
    height: 2px;
    background: #7B5BA7;
  }
  .cards-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 20px;
    margin-bottom: 24px;
  }
  @media (max-width: 768px) {
    .cards-grid {
      grid-template-columns: 1fr;
    }
    .header h1 {
      font-size: 36px;
    }
    .stats-grid {
      grid-template-columns: 1fr 1fr;
    }
  }
  .card {
    background: linear-gradient(135deg, #FFFFFF 0%, #FAFBFF 100%);
    border-radius: 14px;
    padding: 20px;
    cursor: pointer;
    transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    border: 1px solid rgba(123, 91, 167, 0.08);
    position: relative;
    overflow: hidden;
    animation: fadeIn 0.6s ease-out;
  }
  .card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 4px;
    background: linear-gradient(90deg, #7B5BA7 0%, #B565D8 100%);
  }
  .card:hover {
    transform: translateY(-6px);
    box-shadow: 0 12px 24px rgba(123, 91, 167, 0.15);
  }
  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 12px;
  }
  .card-product {
    font-size: 18px;
    font-weight: 700;
    color: #7B5BA7;
  }
  .card-badge {
    font-size: 11px;
    color: #7B5BA7;
    background: linear-gradient(135deg, #E6D9F0 0%, #F0E6F8 100%);
    padding: 4px 10px;
    border-radius: 10px;
    font-weight: 700;
  }
  .card-buyer {
    color: #666;
    font-size: 13px;
    margin-bottom: 12px;
    font-weight: 500;
  }
  .card-info {
    margin-bottom: 12px;
    padding-bottom: 12px;
    border-bottom: 1px solid #F0E6F8;
  }
  .card-row {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    margin-bottom: 6px;
  }
  .card-label {
    color: #999;
  }
  .card-value {
    color: #2C2C2C;
    font-weight: 600;
  }
  .card-price {
    font-size: 20px;
    font-weight: 800;
    color: #7B5BA7;
    margin-bottom: 8px;
  }
  .card-date {
    font-size: 11px;
    color: #BBB;
    font-weight: 500;
  }
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: #999;
    grid-column: 1 / -1;
  }
</style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>☕ 판매 현황</h1>
    </div>

    <div class="stats-section" id="statsSection">
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-icon">📊</div>
          <div class="stat-label">총 주문</div>
          <div class="stat-value" id="totalOrders">0건</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">💰</div>
          <div class="stat-label">총 매출</div>
          <div class="stat-value" id="totalRevenue">0원</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">☕</div>
          <div class="stat-label">인기 상품</div>
          <div class="stat-value" id="topProduct">-</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">📈</div>
          <div class="stat-label">오늘 매출</div>
          <div class="stat-value" id="todayRevenue">0원</div>
        </div>
      </div>

      <div class="chart-container">
        <div class="chart-title">📊 상품별 판매량</div>
        <div class="chart-bars" id="chartBars"></div>
      </div>
    </div>

    <div class="controls">
      <div class="search-box">
        <input
          type="text"
          id="searchInput"
          class="search-input"
          placeholder="🔍 검색..."
        >
      </div>

      <div class="filter-section">
        <label class="filter-label">⏰ 기간</label>
        <div class="filter-tabs" id="periodFilters"></div>
      </div>

      <div class="filter-section" style="margin-top: 16px;">
        <label class="filter-label">☕ 상품</label>
        <div class="filter-tabs" id="productFilters"></div>
      </div>
    </div>

    <div id="content" class="cards-grid"></div>
  </div>

<script>
let allRows = [];
const periods = [
  { key: 'all', label: '📊 전체' },
  { key: 'today', label: '📅 오늘' },
  { key: 'yesterday', label: '📆 어제' },
  { key: 'week', label: '📈 이번주' }
];
const products = ['전체'];
let selectedPeriod = 'all';
let selectedProduct = '전체';

function getToday() {
  const d = new Date();
  return new Date(d.getFullYear(), d.getMonth(), d.getDate());
}

function getDateOnly(dateStr) {
  const d = new Date(dateStr);
  return new Date(d.getFullYear(), d.getMonth(), d.getDate());
}

function filterByPeriod(rows) {
  if (selectedPeriod === 'all') return rows;
  const today = getToday();
  return rows.filter(r => {
    const rowDate = getDateOnly(r.purchased_at);
    switch(selectedPeriod) {
      case 'today':
        return rowDate.getTime() === today.getTime();
      case 'yesterday':
        const yesterday = new Date(today);
        yesterday.setDate(yesterday.getDate() - 1);
        return rowDate.getTime() === yesterday.getTime();
      case 'week':
        const weekStart = new Date(today);
        weekStart.setDate(weekStart.getDate() - today.getDay());
        return rowDate >= weekStart && rowDate <= today;
      default:
        return true;
    }
  });
}

function filterByProduct(rows) {
  if (selectedProduct === '전체') return rows;
  return rows.filter(r => r.product === selectedProduct);
}

function filterBySearch(rows) {
  const query = document.getElementById('searchInput').value.toLowerCase();
  if (!query) return rows;
  return rows.filter(r =>
    r.buyer_name.toLowerCase().includes(query) ||
    r.product.toLowerCase().includes(query)
  );
}

function updateStats(filtered) {
  const totalOrders = filtered.length;
  const totalRevenue = filtered.reduce((sum, r) => sum + r.total_price, 0);

  const today = getToday();
  const todayRows = allRows.filter(r => getDateOnly(r.purchased_at).getTime() === today.getTime());
  const todayRevenue = todayRows.reduce((sum, r) => sum + r.total_price, 0);

  const productCount = {};
  allRows.forEach(r => {
    productCount[r.product] = (productCount[r.product] || 0) + 1;
  });
  const topProd = Object.keys(productCount).sort((a, b) => productCount[b] - productCount[a])[0] || '-';

  document.getElementById('totalOrders').textContent = totalOrders + '건';
  document.getElementById('totalRevenue').textContent = totalRevenue.toLocaleString('ko-KR') + '원';
  document.getElementById('topProduct').textContent = topProd;
  document.getElementById('todayRevenue').textContent = todayRevenue.toLocaleString('ko-KR') + '원';

  updateChart(productCount);
}

function updateChart(productCount) {
  const sorted = Object.entries(productCount)
    .sort((a, b) => b[1] - a[1])
    .slice(0, 5);

  const maxCount = Math.max(...sorted.map(([_, count]) => count), 1);

  document.getElementById('chartBars').innerHTML = sorted.map(([prod, count]) => {
    const height = (count / maxCount) * 100;
    return `
      <div class="chart-bar-group">
        <div class="chart-bar" style="height: ${height}%;"></div>
        <div class="chart-label">${prod}</div>
        <div class="chart-value">${count}</div>
      </div>
    `;
  }).join('');
}

function render(filtered) {
  if (filtered.length === 0) {
    document.getElementById('content').innerHTML = `
      <div class="empty-state">
        <div style="font-size: 48px; margin-bottom: 12px;">📭</div>
        <div style="font-size: 14px;">주문이 없습니다</div>
      </div>
    `;
    return;
  }

  document.getElementById('content').innerHTML = filtered.map((r, idx) => {
    const date = new Date(r.purchased_at);
    const dateStr = date.toLocaleDateString('ko-KR');
    const timeStr = date.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });

    const emojis = {
      '카페라떼': '☕', '아메리카노': '🖤', '코코아': '🤎', '우유': '🥛', '율무차': '🟫'
    };
    const emoji = emojis[r.product] || '☕';

    return `
      <div class="card" style="animation-delay: ${idx * 0.05}s;" onclick="location.href='detail.html?id=${r.id}'">
        <div class="card-header">
          <div class="card-product">${emoji} ${r.product}</div>
          <div class="card-badge">#${r.id}</div>
        </div>
        <div class="card-buyer">👤 ${r.buyer_name}</div>
        <div class="card-info">
          <div class="card-row">
            <span class="card-label">수량</span>
            <span class="card-value">${r.quantity}개</span>
          </div>
          <div class="card-row">
            <span class="card-label">단가</span>
            <span class="card-value">${r.price_per_unit.toLocaleString('ko-KR')}원</span>
          </div>
        </div>
        <div class="card-price">${r.total_price.toLocaleString('ko-KR')}원</div>
        <div class="card-date">${dateStr} ${timeStr}</div>
      </div>
    `;
  }).join('');
}

function applyFilters() {
  let filtered = filterByPeriod(allRows);
  filtered = filterByProduct(filtered);
  filtered = filterBySearch(filtered);
  render(filtered);
  updateStats(filtered);
}

async function load() {
  try {
    const res = await fetch('/api/list');
    if (!res.ok) throw new Error('불러오기 실패');
    allRows = await res.json();

    const prods = [...new Set(allRows.map(r => r.product))];
    products.push(...prods);

    document.getElementById('periodFilters').innerHTML = periods.map(p =>
      `<button class="filter-btn ${p.key === 'all' ? 'active' : ''}" data-period="${p.key}">${p.label}</button>`
    ).join('');

    document.getElementById('productFilters').innerHTML = products.map(p =>
      `<button class="filter-btn ${p === '전체' ? 'active' : ''}" data-product="${p}">${p === '전체' ? '📊 전체' : p}</button>`
    ).join('');

    document.querySelectorAll('[data-period]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('[data-period]').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        selectedPeriod = e.target.dataset.period;
        applyFilters();
      });
    });

    document.querySelectorAll('[data-product]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('[data-product]').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        selectedProduct = e.target.dataset.product;
        applyFilters();
      });
    });

    document.getElementById('searchInput').addEventListener('input', applyFilters);

    applyFilters();
  } catch (e) {
    document.getElementById('content').innerHTML = `<div class="empty-state">❌ 오류: ${e.message}</div>`;
  }
}

load();
</script>
</body>
</html>
