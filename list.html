<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>판매 현황</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }

  body {
    font-family: "Apple SD Gothic Neo", sans-serif;
    background: linear-gradient(135deg, #FAF8FC 0%, #F5F2FA 50%, #FDF7F7 100%);
    min-height: 100vh;
    color: #2C2C2C;
  }
  .container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 24px 16px;
  }
  .header {
    text-align: center;
    margin-bottom: 40px;
    animation: fadeIn 0.6s ease-out;
  }
  .header h1 {
    font-size: 48px;
    margin-bottom: 12px;
    background: linear-gradient(135deg, #7B5BA7 0%, #B565D8 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    font-weight: 700;
    letter-spacing: -1px;
  }
  .header p {
    color: #999;
    font-size: 15px;
    font-weight: 500;
  }
  .controls {
    background: linear-gradient(135deg, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0.85) 100%);
    border-radius: 16px;
    padding: 28px;
    margin-bottom: 32px;
    box-shadow: 0 8px 32px rgba(123, 91, 167, 0.12);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(123, 91, 167, 0.1);
    animation: fadeIn 0.8s ease-out;
  }
  .search-box {
    display: flex;
    gap: 12px;
    margin-bottom: 20px;
  }
  .search-input {
    flex: 1;
    padding: 14px 18px;
    border: 2px solid #E6D9F0;
    border-radius: 12px;
    font-size: 15px;
    font-family: inherit;
    transition: all 0.3s;
    background: linear-gradient(135deg, #FFFFFF 0%, #FAF8FC 100%);
  }
  .search-input:focus {
    outline: none;
    border-color: #7B5BA7;
    box-shadow: 0 0 0 4px rgba(123, 91, 167, 0.15);
    transform: translateY(-2px);
  }
  .search-input::placeholder {
    color: #BBB;
  }
  .filter-label {
    font-size: 13px;
    color: #7B5BA7;
    margin-bottom: 10px;
    display: block;
    font-weight: 700;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }
  .filter-buttons {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .filter-btn {
    padding: 10px 20px;
    border: 2px solid #E6D9F0;
    background: white;
    border-radius: 24px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    transition: all 0.3s;
    color: #7B5BA7;
    background: linear-gradient(135deg, #FFFFFF 0%, #FAF8FC 100%);
  }
  .filter-btn:hover {
    border-color: #B565D8;
    color: #B565D8;
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(181, 101, 216, 0.15);
  }
  .filter-btn.active {
    background: linear-gradient(135deg, #7B5BA7 0%, #B565D8 100%);
    color: white;
    border-color: transparent;
    box-shadow: 0 8px 20px rgba(123, 91, 167, 0.3);
    transform: translateY(-2px);
  }
  .meta {
    font-size: 13px;
    color: #999;
    margin-top: 18px;
    padding-top: 16px;
    border-top: 1px dashed #E6D9F0;
  }
  .meta a {
    color: #7B5BA7;
    font-weight: 600;
    text-decoration: none;
    transition: all 0.3s;
  }
  .meta a:hover {
    color: #B565D8;
  }
  .cards-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 20px;
    margin-bottom: 24px;
  }
  @media (max-width: 768px) {
    .cards-grid {
      grid-template-columns: 1fr;
    }
    .header h1 {
      font-size: 36px;
    }
  }
  .card {
    background: linear-gradient(135deg, #FFFFFF 0%, #FAFBFF 100%);
    border-radius: 16px;
    padding: 24px;
    cursor: pointer;
    transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    border: 1px solid rgba(123, 91, 167, 0.08);
    position: relative;
    overflow: hidden;
    animation: fadeIn 0.6s ease-out;
  }
  .card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 4px;
    background: linear-gradient(90deg, #7B5BA7 0%, #B565D8 100%);
  }
  .card:hover {
    transform: translateY(-8px);
    box-shadow: 0 16px 32px rgba(123, 91, 167, 0.2);
    border-color: rgba(123, 91, 167, 0.2);
    background: linear-gradient(135deg, #FFFFFF 0%, #F5F2FA 100%);
  }
  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 16px;
  }
  .card-product {
    font-size: 20px;
    font-weight: 700;
    background: linear-gradient(135deg, #7B5BA7 0%, #B565D8 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .card-badge {
    display: inline-block;
    font-size: 11px;
    color: #7B5BA7;
    background: linear-gradient(135deg, #E6D9F0 0%, #F0E6F8 100%);
    padding: 6px 12px;
    border-radius: 12px;
    font-weight: 700;
    box-shadow: 0 2px 8px rgba(123, 91, 167, 0.1);
  }
  .card-buyer {
    color: #666;
    font-size: 14px;
    margin-bottom: 14px;
    font-weight: 500;
  }
  .card-info {
    margin-bottom: 14px;
  }
  .card-row {
    display: flex;
    justify-content: space-between;
    margin-bottom: 10px;
    font-size: 13px;
    padding-bottom: 8px;
    border-bottom: 1px solid #F0E6F8;
    align-items: center;
  }
  .card-label {
    color: #999;
    font-weight: 500;
  }
  .card-value {
    color: #2C2C2C;
    font-weight: 600;
    color: #7B5BA7;
  }
  .card-price {
    padding-top: 14px;
    margin-top: 8px;
    border-top: 2px solid #E6D9F0;
    font-size: 24px;
    font-weight: 800;
    background: linear-gradient(135deg, #7B5BA7 0%, #B565D8 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: -0.5px;
  }
  .card-date {
    font-size: 11px;
    color: #BBB;
    margin-top: 10px;
    font-weight: 500;
  }
  .empty-state {
    text-align: center;
    padding: 80px 20px;
    color: #999;
    grid-column: 1 / -1;
  }
  .empty-state-icon {
    font-size: 64px;
    margin-bottom: 16px;
    animation: pulse 2s infinite;
  }
  .empty-state-text {
    font-size: 16px;
    font-weight: 500;
  }
</style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>☕ 판매 현황</h1>
      <p id="count"></p>
    </div>

    <div class="controls">
      <div class="search-box">
        <input
          type="text"
          id="searchInput"
          class="search-input"
          placeholder="🔍 고객명 또는 상품명으로 검색..."
        >
      </div>

      <div>
        <label class="filter-label">⏰ 기간 필터</label>
        <div class="filter-buttons">
          <button class="filter-btn active" data-filter="all">📊 전체</button>
          <button class="filter-btn" data-filter="today">📅 오늘</button>
          <button class="filter-btn" data-filter="yesterday">📆 어제</button>
          <button class="filter-btn" data-filter="week">📈 이번주</button>
        </div>
      </div>

      <div class="meta">
        <span id="result-count"></span> · <a href="index.html">✏️ 주문 등록하기</a>
      </div>
    </div>

    <div id="content" class="cards-grid"></div>
  </div>

<script>
let allRows = [];

function getToday() {
  const d = new Date();
  return new Date(d.getFullYear(), d.getMonth(), d.getDate());
}

function getDateOnly(dateStr) {
  const d = new Date(dateStr);
  return new Date(d.getFullYear(), d.getMonth(), d.getDate());
}

function filterByDate(rows, filter) {
  const today = getToday();
  return rows.filter(r => {
    const rowDate = getDateOnly(r.purchased_at);
    switch(filter) {
      case 'today':
        return rowDate.getTime() === today.getTime();
      case 'yesterday':
        const yesterday = new Date(today);
        yesterday.setDate(yesterday.getDate() - 1);
        return rowDate.getTime() === yesterday.getTime();
      case 'week':
        const weekStart = new Date(today);
        weekStart.setDate(weekStart.getDate() - today.getDay());
        return rowDate >= weekStart && rowDate <= today;
      default:
        return true;
    }
  });
}

function filterBySearch(rows, query) {
  if (!query) return rows;
  const lower = query.toLowerCase();
  return rows.filter(r =>
    r.buyer_name.toLowerCase().includes(lower) ||
    r.product.toLowerCase().includes(lower)
  );
}

function render(filtered) {
  if (filtered.length === 0) {
    document.getElementById('content').innerHTML = `
      <div class="empty-state">
        <div class="empty-state-icon">📭</div>
        <div class="empty-state-text">아직 주문이 없습니다</div>
      </div>
    `;
    return;
  }

  document.getElementById('content').innerHTML = filtered.map((r, idx) => {
    const date = new Date(r.purchased_at);
    const dateStr = date.toLocaleDateString('ko-KR');
    const timeStr = date.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
    const productEmoji = {
      '카페라떼': '☕',
      '아메리카노': '🖤',
      '코코아': '🤎',
      '우유': '🥛',
      '율무차': '🟫'
    };
    const emoji = productEmoji[r.product] || '☕';

    return `
      <div class="card" style="animation-delay: ${idx * 0.05}s;" onclick="location.href='detail.html?id=${r.id}'">
        <div class="card-header">
          <div class="card-product">${emoji} ${r.product}</div>
          <div class="card-badge">#${r.id}</div>
        </div>
        <div class="card-buyer">👤 ${r.buyer_name}</div>
        <div class="card-info">
          <div class="card-row">
            <span class="card-label">수량</span>
            <span class="card-value">${r.quantity}개</span>
          </div>
          <div class="card-row">
            <span class="card-label">단가</span>
            <span class="card-value">${r.price_per_unit.toLocaleString('ko-KR')}원</span>
          </div>
        </div>
        <div class="card-price">${r.total_price.toLocaleString('ko-KR')}원</div>
        <div class="card-date">${dateStr} ${timeStr}</div>
      </div>
    `;
  }).join('');

  document.getElementById('result-count').textContent = `✨ 총 ${filtered.length}건`;
}

function applyFilters() {
  const searchQuery = document.getElementById('searchInput').value;
  const activeFilter = document.querySelector('.filter-btn.active').dataset.filter;

  let filtered = filterByDate(allRows, activeFilter);
  filtered = filterBySearch(filtered, searchQuery);

  render(filtered);
}

async function load() {
  try {
    const res = await fetch('/api/list');
    if (!res.ok) {
      document.getElementById('content').innerHTML = '<p style="color: #d32f2f; text-align: center; padding: 40px;">❌ 불러오기에 실패했습니다</p>';
      return;
    }
    allRows = await res.json();
    document.getElementById('count').textContent = `최신 구매가 맨 위에 옵니다`;
    applyFilters();
  } catch (e) {
    document.getElementById('content').innerHTML = `<p style="color: #d32f2f; text-align: center; padding: 40px;">❌ 오류: ${e.message}</p>`;
  }
}

document.getElementById('searchInput').addEventListener('input', applyFilters);
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', (e) => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    e.target.classList.add('active');
    applyFilters();
  });
});

load();
</script>
</body>
</html>
